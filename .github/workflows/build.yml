name: Build NIMIS

on:
  push:
    branches: [main, feat/field-reporting-dashboard-test-v1, feat/presentation-connected-workflow-v1]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate local PowerShell launch syntax
        shell: pwsh
        run: |
          $scripts = @('scripts/START_NIMIS_PRESENTATION.ps1', 'scripts/START_NIMIS_WEB_LOCAL.ps1', 'scripts/START_NIMIS_CORE_LOCAL.ps1', 'scripts/ENABLE_FICTIONAL_FORM_REVIEW.ps1', 'scripts/TEST_PRESENTATION_BRIDGE.ps1')
          foreach ($path in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) { Write-Error "$path : $parseError" }
              throw "PowerShell syntax validation failed: $path"
            }
            Write-Host "POWERSHELL_PARSE_PASS: $path"
          }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify NIMIS requirements and KPI logic
        run: npm test
      - name: Build application
        run: npm run build
