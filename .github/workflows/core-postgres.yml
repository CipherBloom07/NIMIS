name: NIMIS Core PostgreSQL concurrency and workflow

on:
  pull_request:
    branches: [main, feat/nimis-core-transactional-backend, feat/collector-field-form-staging-contract, feat/official-readiness-identity-v1]
  push:
    branches: [main, feat/nimis-core-transactional-backend, feat/official-readiness-identity-v1, feat/collector-correction-reconciliation-v1, feat/field-reporting-dashboard-test-v1, feat/security-hardening-pilot-v1]

jobs:
  postgres_core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nimis_core_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nimis_core_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      NIMIS_TEST_DATABASE_URL: postgresql://postgres:test-only-local-password@127.0.0.1:5432/nimis_core_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core dependencies
        run: python -m pip install -r server/core/requirements.txt
      - name: Exercise PostgreSQL transactions and authorization
        run: python -m pytest server/core/test_core.py -vv
